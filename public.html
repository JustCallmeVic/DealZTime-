<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DealZTime Generator</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;max-width:700px;margin:0 auto;padding:20px;background:#0a0a0a;color:#eee;min-height:100vh}
    h1{font-size:24px;margin-bottom:4px}
    .sub{color:#888;margin-bottom:20px;font-size:13px}
    .field{margin-bottom:14px}
    .field label{display:block;color:#aaa;font-size:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
    .field input,.field select{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#eee;font-size:14px;font-family:inherit}
    .field input:focus,.field select:focus{outline:none;border-color:#25D366}
    .row{display:flex;gap:12px}
    .row .field{flex:1}
    .btn{display:block;width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
    .btn-green{background:#25D366;color:#000}
    .btn-green:hover{opacity:.9}
    .btn-orange{background:#ff6b35;color:#fff}
    .btn-orange:hover{opacity:.9}
    .btn-dark{background:#333;color:#fff;border:1px solid #555}
    .btn-dark:hover{background:#444}
    .btn-dark.copied{background:#25D366;color:#000;border-color:#25D366}
    .preview-box{background:#111;border-radius:12px;padding:20px;margin-top:16px;border:1px solid #2a2a2a;display:none;white-space:pre-wrap;font-size:14px;line-height:1.7;color:#ddd;font-family:inherit}
    .btns-row{display:none;gap:10px;margin-top:10px}
    .btns-row .btn{flex:1}
    .saved-item{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:14px;margin-bottom:10px}
    .saved-item .saved-text{font-size:12px;color:#aaa;white-space:pre-wrap;line-height:1.5;margin-bottom:10px;max-height:120px;overflow:hidden}
    .saved-item .saved-meta{font-size:11px;color:#555;margin-bottom:8px}
    .saved-item .saved-btns{display:flex;gap:8px}
    .saved-item .saved-btns button{padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer}
    .sb-copy{background:#25D366;color:#000}
    .sb-del{background:#333;color:#aaa;border:1px solid #444}
    .sb-del:hover{background:#600}
    .empty{color:#555;font-size:13px;padding:20px;text-align:center}
    .footer{color:#444;margin-top:30px;font-size:11px;text-align:center}
  </style>
</head>
<body>
  <h1>DealZTime Generator</h1>
  <p class="sub">Fuelle die Felder aus und erstelle deine WhatsApp-Nachricht</p>

  <div class="field">
    <label>Kategorie</label>
    <select id="cat">
      <option value="GETRÄNKE">Getränke</option>
      <option value="TECHNIK">Technik</option>
      <option value="HAUSHALT">Haushalt</option>
      <option value="LIVING">Wohnen</option>
      <option value="FREIZEIT">Freizeit</option>
      <option value="SPORT">Sport</option>
      <option value="KÜCHE">Küche</option>
      <option value="ELEKTRONIK">Elektronik</option>
      <option value="BAUHAUS">Bauhaus</option>
      <option value="KINDER">Kinder</option>
      <option value="OUTDOOR">Outdoor</option>
      <option value="BEAUTY">Beauty</option>
      <option value="MODE">Mode</option>
      <option value="DEAL DES TAGES">Deal des Tages</option>
    </select>
  </div>

  <div class="field">
    <label>Produktname</label>
    <input id="product" placeholder="z.B. Sparkling Wasser 24er Pack">
  </div>

  <div class="field">
    <label>Kurzbeschreibung (optional)</label>
    <input id="desc" placeholder="z.B. Erfrischendes Getraenk">
  </div>

  <div class="row">
    <div class="field">
      <label>Alter Preis (EUR)</label>
      <input id="oldPrice" type="number" step="0.01" placeholder="21.32">
    </div>
    <div class="field">
      <label>Neuer Preis (EUR)</label>
      <input id="newPrice" type="number" step="0.01" placeholder="14.99">
    </div>
  </div>

  <div class="field">
    <label>Amazon Link</label>
    <input id="link" placeholder="https://www.amazon.de/dp/B08YHT8V3F">
  </div>

  <button class="btn btn-green" onclick="generate()">Nachricht erstellen</button>

  <div class="preview-box" id="preview"></div>
  <div class="btns-row" id="btnsRow">
    <button class="btn btn-dark" onclick="copyMsg()">Kopieren</button>
    <button class="btn btn-orange" onclick="saveDeal()">Speichern</button>
  </div>

  <h2 style="font-size:18px;margin:30px 0 12px;color:#25D366">Gespeicherte Deals (<span id="savedCount">0</span>)</h2>
  <div id="savedList">
    <div class="empty">Noch keine Deals gespeichert.</div>
  </div>
  <button class="btn btn-green" style="display:none;margin-top:10px" id="copyAllBtn" onclick="copyAll()">Alle Deals kopieren</button>

  <p class="footer">DealZTime &mdash; Affiliate-Tag: dealztime0c-21</p>

  <script>
    var CATS = {
      "GETRÄNKE": "🥤",
      "TECHNIK": "💻",
      "HAUSHALT": "🏠",
      "LIVING": "🛋️",
      "FREIZEIT": "🎮",
      "SPORT": "💪",
      "KÜCHE": "🍳",
      "ELEKTRONIK": "⚡",
      "BAUHAUS": "🔧",
      "KINDER": "👶",
      "OUTDOOR": "⛺",
      "BEAUTY": "💄",
      "MODE": "👟",
      "DEAL DES TAGES": "🔥"
    };

    var lastMsg = "";

    function generate() {
      var cat = document.getElementById("cat").value;
      var product = document.getElementById("product").value || "[Produkt]";
      var desc = document.getElementById("desc").value;
      var oldP = parseFloat(document.getElementById("oldPrice").value);
      var newP = parseFloat(document.getElementById("newPrice").value);
      var link = document.getElementById("link").value || "https://www.amazon.de/...";
      var emoji = CATS[cat] || "🔥";
      var tag = link.indexOf("?") > -1 ? link + "&tag=dealztime0c-21" : link + "?tag=dealztime0c-21";

      var lines = [];
      lines.push(emoji + " *" + cat + "-DEAL DES TAGES* 🔥");
      lines.push("");
      lines.push("💦 *" + product + "*");
      if (desc) {
        lines.push("✨ " + desc);
        lines.push("");
      }
      lines.push("");
      if (oldP && newP) {
        var savings = (oldP - newP).toFixed(2).replace(".", ",");
        var percent = Math.round((1 - newP / oldP) * 100);
        lines.push("~" + oldP.toFixed(2).replace(".", ",") + " €~ → *" + newP.toFixed(2).replace(".", ",") + " €* 💥");
        lines.push("💰 *" + savings + " € sparen!*");
        lines.push("📉 *ca. " + percent + " % günstiger*");
        lines.push("");
      }
      lines.push("");
      lines.push("👉 *Jetzt bei Amazon sichern:*");
      lines.push(tag);
      lines.push("");
      lines.push("");
      lines.push("⚡ *Deal kann jederzeit enden – schnell sein!*");
      lines.push("");
      lines.push("👉 *Folge uns auch auf WhatsApp!*");
      lines.push("https://whatsapp.com/channel/0029Vb8nDX2F1YlZ5KEKZc3f");

      lastMsg = lines.join("\n");

      document.getElementById("preview").textContent = lastMsg;
      document.getElementById("preview").style.display = "block";
      document.getElementById("btnsRow").style.display = "flex";
    }

    function copyMsg() {
      if (!lastMsg) return;
      navigator.clipboard.writeText(lastMsg).then(function() {
        var btn = document.querySelector("#btnsRow .btn-dark");
        btn.textContent = "Kopiert!";
        btn.classList.add("copied");
        setTimeout(function() { btn.textContent = "Kopieren"; btn.classList.remove("copied"); }, 2000);
      });
    }

    function saveDeal() {
      if (!lastMsg) return;
      var deals = JSON.parse(localStorage.getItem("deals") || "[]");
      deals.unshift({
        msg: lastMsg,
        product: document.getElementById("product").value,
        date: new Date().toLocaleDateString("de-DE")
      });
      localStorage.setItem("deals", JSON.stringify(deals));
      loadSaved();
    }

    function loadSaved() {
      var deals = JSON.parse(localStorage.getItem("deals") || "[]");
      document.getElementById("savedCount").textContent = deals.length;
      document.getElementById("copyAllBtn").style.display = deals.length > 1 ? "block" : "none";
      var list = document.getElementById("savedList");
      if (deals.length === 0) {
        list.innerHTML = '<div class="empty">Noch keine Deals gespeichert.</div>';
        return;
      }
      var html = "";
      for (var i = 0; i < deals.length; i++) {
        html += '<div class="saved-item">';
        html += '<div class="saved-meta">' + deals[i].date + " — " + (deals[i].product || "Deal") + "</div>";
        html += '<div class="saved-text">' + deals[i].msg.replace(/</g, "&lt;") + "</div>";
        html += '<div class="saved-btns">';
        html += '<button class="sb-copy" onclick="copySaved(' + i + ')">Kopieren</button>';
        html += '<button class="sb-del" onclick="deleteDeal(' + i + ')">Loeschen</button>';
        html += "</div></div>";
      }
      list.innerHTML = html;
    }

    function copySaved(i) {
      var deals = JSON.parse(localStorage.getItem("deals") || "[]");
      if (!deals[i]) return;
      navigator.clipboard.writeText(deals[i].msg);
    }

    function deleteDeal(i) {
      var deals = JSON.parse(localStorage.getItem("deals") || "[]");
      deals.splice(i, 1);
      localStorage.setItem("deals", JSON.stringify(deals));
      loadSaved();
    }

    function copyAll() {
      var deals = JSON.parse(localStorage.getItem("deals") || "[]");
      var all = deals.map(function(d) { return d.msg; }).join("\n\n---\n\n");
      navigator.clipboard.writeText(all).then(function() {
        var btn = document.getElementById("copyAllBtn");
        btn.textContent = "Alle kopiert!";
        setTimeout(function() { btn.textContent = "Alle Deals kopieren"; }, 2000);
      });
    }

    loadSaved();
  </script>
</body>
</html>
