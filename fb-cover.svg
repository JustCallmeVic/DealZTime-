<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#128C7E"/>
      <stop offset="100%" style="stop-color:#075E54"/>
    </linearGradient>
  </defs>
  <rect width="820" height="312" fill="#0a0a0a"/>
  <rect x="0" y="0" width="4" height="312" fill="url(#g)"/>
  <rect x="0" y="280" width="820" height="32" fill="url(#g)" opacity="0.3"/>
  <!-- DealZTime Text -->
  <text x="60" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="60" font-weight="200" fill="#ffffff" letter-spacing="2">Deal</text>
  <text x="260" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#25D366" letter-spacing="2">Z</text>
  <text x="310" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="60" font-weight="200" fill="#ffffff" letter-spacing="2">Time</text>
  <!-- Subtitle -->
  <text x="62" y="175" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#888888" letter-spacing="6">TAEGLICHE AMAZON-DEALS MIT ECHTEN RABATTEN</text>
  <!-- Stats -->
  <text x="62" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#25D366" letter-spacing="1">🔥 Deals</text>
  <text x="200" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#25D366" letter-spacing="1">💰 Sparen</text>
  <text x="340" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#25D366" letter-spacing="1">⚡ Schnell zugreifen</text>
  <!-- WhatsApp -->
  <rect x="60" y="260" width="260" height="30" rx="6" fill="#25D366" opacity="0.15"/>
  <text x="80" y="281" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#25D366">📱 Folge uns auf WhatsApp</text>
